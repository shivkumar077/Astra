name: ASTRA CI/CD Quality Gates

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Repository Hygiene & Whitespace Audit
  # ----------------------------------------------------------------------------
  repository-hygiene:
    name: Repository Hygiene & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify repository hygiene (git diff --check)
        run: |
          git diff --check HEAD~1 HEAD || true

  # ----------------------------------------------------------------------------
  # 2. Backend Automated Test Suite & Compilation Gate
  # ----------------------------------------------------------------------------
  backend-verify:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Execute Backend Tests (JUnit 5, Mockito, SpringBootTest)
        working-directory: backend
        run: ./mvnw clean test -B

  # ----------------------------------------------------------------------------
  # 3. Frontend Quality Gate (TypeScript, Vitest, Production Bundle)
  # ----------------------------------------------------------------------------
  frontend-verify:
    name: Frontend Typecheck, Vitest Suite & Vite Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Static Analysis & Lint Gate
        working-directory: frontend
        run: npm run lint

      - name: Execute Vitest Test Suites
        working-directory: frontend
        run: npm test

      - name: Compile Production Distribution (Vite Build)
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 4. Container Build Verification Gate
  # ----------------------------------------------------------------------------
  container-build-verify:
    name: Container Build Reproducibility Verification
    needs: [backend-verify, frontend-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: astra-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: astra-frontend:ci-test
