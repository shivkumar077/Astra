# ==============================================================================
# ASTRA — Multi-Container Local & Production Preview Compose Specification
# ==============================================================================
# Launch: docker compose up --build -d
# Teardown: docker compose down -v
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: astra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astra_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - astra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-astra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - astra-network

  # ----------------------------------------------------------------------------
  # 2. ASTRA Spring Boot Modular Monolith Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: astra-backend:latest
    container_name: astra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-astra_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1
      ASTRA_SECURITY_VIEWER_USERNAME: ${ASTRA_SECURITY_VIEWER_USERNAME:-viewer}
      ASTRA_SECURITY_VIEWER_PASSWORD: ${ASTRA_SECURITY_VIEWER_PASSWORD:-viewer123}
      ASTRA_SECURITY_OPERATOR_USERNAME: ${ASTRA_SECURITY_OPERATOR_USERNAME:-operator}
      ASTRA_SECURITY_OPERATOR_PASSWORD: ${ASTRA_SECURITY_OPERATOR_PASSWORD:-operator123}
      ASTRA_SECURITY_DIRECTOR_USERNAME: ${ASTRA_SECURITY_DIRECTOR_USERNAME:-director}
      ASTRA_SECURITY_DIRECTOR_PASSWORD: ${ASTRA_SECURITY_DIRECTOR_PASSWORD:-director123}
      ASTRA_SECURITY_ADMIN_USERNAME: ${ASTRA_SECURITY_ADMIN_USERNAME:-admin}
      ASTRA_SECURITY_ADMIN_PASSWORD: ${ASTRA_SECURITY_ADMIN_PASSWORD:-admin123}
      NASA_IMAGES_API_BASE_URL: ${NASA_IMAGES_API_BASE_URL:-https://images-api.nasa.gov}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - astra-network

  # ----------------------------------------------------------------------------
  # 3. ASTRA React + Vite + Three.js Frontend Client (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: astra-frontend:latest
    container_name: astra-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - astra-network

volumes:
  astra_pgdata:
    name: astra_pgdata

networks:
  astra-network:
    name: astra-network
    driver: bridge
