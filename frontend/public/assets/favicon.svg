<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="astra-star-gold" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="45%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="astra-core-glow" cx="16" cy="16" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aerospace Void Disc (Guarantees contrast on both light and dark browser tabs) -->
  <circle cx="16" cy="16" r="15" fill="#08090C" stroke="#FDE68A" stroke-opacity="0.32" stroke-width="0.8" />

  <!-- Subtle Core Starlight Aureole -->
  <circle cx="16" cy="16" r="6.5" fill="url(#astra-core-glow)" />

  <!-- ASTRA Signature 4-Point Acute Celestial Diamond Flare -->
  <path
    d="M 16 4.5 L 18.2 13.8 L 27.5 16 L 18.2 18.2 L 16 27.5 L 13.8 18.2 L 4.5 16 L 13.8 13.8 Z"
    fill="url(#astra-star-gold)"
  />

  <!-- Brilliant Starlight Nucleus -->
  <circle cx="16" cy="16" r="1.8" fill="#FFFFFF" />
  <circle cx="16" cy="16" r="3.4" fill="#FDE68A" fill-opacity="0.35" />
</svg>
